[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daph-exfusion"
version = "3.7.1"
description = "HRM adaptive memory control plane: gated retrieval, evidence, and compute research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DAPH / ExFusion contributors" }]
keywords = ["mamba", "ssm", "moe", "hybrid", "transformer", "model-merging", "dare", "ties"]
dependencies = [
    "cryptography>=42",
    "numpy>=1.24",
    "torch>=2.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
pretrained = ["transformers>=4.40"]
hrm = ["transformers>=5.9.0", "huggingface-hub>=0.34", "accelerate>=0.34"]
qualification = [
    "numpy==2.4.6",
    "torch==2.10.0",
    "pytest==8.4.2",
    "transformers==5.14.1",
    "huggingface-hub==1.26.1",
    "accelerate==1.13.0",
    "psutil==7.2.2",
    "litlogger==2026.6.25",
    "lightning-sdk==2026.6.30",
    "pip==26.1.2",
    "setuptools==82.0.1",
    "wheel==0.47.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["daph*", "hrm_adaptive_memory*", "hrm_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
